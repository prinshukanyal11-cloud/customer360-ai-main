[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["B008"]  # function call in default arg (FastAPI Depends pattern)

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "E101"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
name: Deploy (build images)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # The image is only built after the same tests CI runs, so a red build here
  # means the code was green a moment ago rather than "we hope".
  test:
    name: Verify before building
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests scripts migrations
      - run: pytest

  build-images:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to GHCR requires an explicit grant; nothing else is granted.
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend.Dockerfile
            target: prod
            context: .
          - name: frontend
            dockerfile: docker/frontend.Dockerfile
            target: serve
            context: .
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # A summary the operator can read, instead of a tar archive of /dev/null that
  # looked like a deployment artifact but contained nothing.
  summary:
    name: Publish deployment summary
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Record what was published
        run: |
          {
            echo "### Images published"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| \`backend\` | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}\` |"
            echo "| \`frontend\` | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}\` |"
            echo ""
            echo "Deploy with \`docker compose -f docker-compose.prod.yml up -d\`, overriding"
            echo "\`DATABASE_URL\`, \`JWT_SECRET\`, \`SECRET_KEY\`, and \`DATABASE_URL_RO\` from your"
            echo "host platform's secret store. Secrets are never stored in this repository."
            echo ""
            echo "The API refuses to start if those are left at their shipped defaults."
          } >> "$GITHUB_STEP_SUMMARY"
